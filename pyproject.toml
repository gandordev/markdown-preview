[project]
name = "markdown-preview"
version = "0.1.0"
requires-python = ">=3.14"
description = "Markdown preview CLI"
dependencies = [
    "click>=8.0",
    "fastapi>=0.128.0",
    "MagicConvert>=0.1.3",
    "python-multipart>=0.0.21",
    "uvicorn>=0.40.0",
    "watchfiles>=1.1.1",
    "websockets>=15.0.1",
]

[project.scripts]
markdown-preview = "back.main:main"
mdp = "back.main:main"

[tool.hatch.build.targets.wheel]
packages = ["back"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
